<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foot Size</title>
<style>
  :root{
    color-scheme:light dark;
    --ink:#12151a; --paper:#fbfaf7; --line:#d8d4cc; --accent:#b4501e; --muted:#6b6559;
    --yes:#1c7a4a; --no:#a3341f;
    /* Four steps, roughly a 1.3 ratio apart. A popup is small, which is a
       reason for fewer sizes rather than for five that nearly match. */
    --t-lead:1.375rem;   /* the one number the popup exists to show */
    --t-title:1.0625rem;
    --t-body:0.875rem;
    --t-small:0.75rem;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#eceae5; --paper:#14161a; --line:#2e3238; --accent:#e8813f; --muted:#9a958b;
           --yes:#4fbb84; --no:#e8705a; }
  }
  *{box-sizing:border-box}
  body{width:22rem;margin:0;padding:1rem 1.1rem 1.2rem;background:var(--paper);color:var(--ink);
    font:var(--t-body)/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  h1{font-size:var(--t-title);margin:0 0 .15rem;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:var(--t-small);margin:0 0 1rem}
  label{display:block;font-weight:600;font-size:var(--t-small);margin-bottom:.3rem}
  input,textarea{font:inherit;width:100%;padding:.45rem .55rem;border-radius:.35rem;
    background:transparent;color:inherit;border:1px solid var(--line)}
  input{font-size:var(--t-lead);max-width:7rem;font-variant-numeric:tabular-nums}
  textarea{resize:vertical;min-height:3.2rem}
  input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .row{margin-bottom:1rem}
  .mine{font-size:var(--t-small);color:var(--muted);margin:.4rem 0 0;min-height:1.6em}
  .mine b{color:var(--accent);font-size:var(--t-lead);font-variant-numeric:tabular-nums}
  .verdict{margin:.55rem 0 0;padding:.55rem .7rem;border-radius:.35rem;border:1px solid var(--line);
    min-height:2.6rem}
  .verdict.yes{border-color:var(--yes);color:var(--yes);font-weight:600}
  .verdict.no{border-color:var(--no);color:var(--no);font-weight:600}
  .verdict .found{display:block;font-weight:400;font-size:var(--t-small);color:var(--muted);
    margin-top:.25rem;font-variant-numeric:tabular-nums}
  .tip{margin:1rem 0 0;padding-top:.8rem;border-top:1px solid var(--line);
    color:var(--muted);font-size:var(--t-small)}
  a{color:var(--accent)}
</style>
</head>
<body>
  <h1>Foot Size</h1>
  <p class="sub">Your size comes from your foot, not from another brand's chart.</p>

  <div class="row">
    <label for="cm">Your foot length, centimetres</label>
    <input id="cm" type="number" inputmode="decimal" min="18" max="36" step="0.1" placeholder="26.5">
    <p class="mine" id="mine">Enter it once. It is remembered.</p>
  </div>

  <div class="row">
    <label for="list">Paste a size list from a shop</label>
    <textarea id="list" placeholder="40  41  42⅓  42⅔  43"></textarea>
    <div class="verdict" id="verdict">Waiting for a list.</div>
  </div>

  <p class="tip">Quicker: select the sizes on any page, right-click, and choose
  <b>Is my size in this list?</b> No page permissions needed.</p>
</body>
<script type="module" src="popup.js"></script>
</html>
